<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Configurações - Semaphore JS</title>
  <link rel="stylesheet" href="settings.css">
</head>
<body>
  <div class="settings-container">
    <h2>Configurações do Semáforo</h2>
    
    <div class="form-group">
      <label for="theme-select">Layout / Orientação</label>
      <select id="theme-select">
        <option value="vertical">Vertical (Tradicional)</option>
        <option value="horizontal">Horizontal (Barra)</option>
      </select>
    </div>

    <div class="form-group">
      <label for="timeout-input">Tempo Limite de Inatividade (segundos)</label>
      <input type="number" id="timeout-input" min="10" max="3600" value="300">
      <small>Tempo para as luzes voltarem ao verde caso o agente pare de responder.</small>
    </div>

    <div class="form-group checkbox-group">
      <input type="checkbox" id="stealth-checkbox">
      <label for="stealth-checkbox">Modo Furtivo (Ocultar de capturas de tela)</label>
    </div>

    <div class="form-group checkbox-group">
      <input type="checkbox" id="autostart-checkbox">
      <label for="autostart-checkbox">Iniciar com o sistema</label>
    </div>

    <div class="form-group">
      <label for="workspace-input">Caminho do Workspace (Projeto)</label>
      <input type="text" id="workspace-input" placeholder="Ex: C:\Users\Nome\MeuProjeto">
      <small>Caminho do repositório para sincronizar o arquivo de estado silencioso (.agents/state.json).</small>
    </div>

    <div class="actions">
      <button id="btn-save" class="btn primary">Salvar</button>
      <button id="btn-cancel" class="btn secondary">Cancelar</button>
    </div>
  </div>

  <script src="settings.js"></script>
</body>
</html>
